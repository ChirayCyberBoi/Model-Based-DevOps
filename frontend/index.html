
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model-Based DevOps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Model-Based DevOps</h1>
        <p>Visual DevOps Workflow Generator</p>
    </header>

    <main>
        <h2>Create Your Pipeline</h2>
        <p>Design and manage your software development workflow.</p>

        <div class="pipeline">
            <div class="stage">Source Code</div>
            <span>→</span>
            <div class="stage">Build</div>
            <span>→</span>
            <div class="stage">Testing</div>
            <span>→</span>
            <div class="stage">Deployment</div>
        </div>

        <button>Create Workflow</button>
    </main>
<script src="script.js"></script>
</body>
</html>
