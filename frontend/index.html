
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model-Based DevOps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Model-Based DevOps</h1>
        <p>Visual DevOps Workflow Generator</p>
    </header>

    <main>
        <h2>Create Your Pipeline</h2>
        <p>Design and manage your software development workflow.</p>

        <div class="workflow-form">

    <label>Workflow Name:</label>
    <input type="text" id="workflowName" value="My First Pipeline">

    <h3>Select Pipeline Stages:</h3>

    <label><input type="checkbox" value="Source Code" checked> Source Code</label>
    <label><input type="checkbox" value="Build" checked> Build</label>
    <label><input type="checkbox" value="Testing" checked> Testing</label>
    <label><input type="checkbox" value="Deployment" checked> Deployment</label>

</div>

<button id="createWorkflow">Create Workflow</button>

<pre id="output"></pre>
        <button id="downloadWorkflow" style="display: none;">
    Download YAML
</button>
    </main>
<script src="script.js"></script>
</body>
</html>
