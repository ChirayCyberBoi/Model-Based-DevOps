
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model-Based DevOps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Model-Based DevOps</h1>
        <p>Visual DevOps Workflow Generator</p>
    </header>

    <main>
        <h2>Create Your Pipeline</h2>
        <p>Design and manage your software development workflow.</p>

        <div class="workflow-form">

    <label>Workflow Name:</label>
    <input type="text" id="workflowName" value="My First Pipeline">

  <h3>Design Your Pipeline:</h3>

<div id="stageList">
    <div class="add-stage">

    <select id="newStage">
        <option value="">Select a stage</option>
        <option value="Source Code">Source Code</option>
        <option value="Build">Build</option>
        <option value="Testing">Testing</option>
        <option value="Deployment">Deployment</option>
    </select>

    <button type="button" id="addStage">Add Stage</button>

</div>

    <div class="stage-item">
        <input type="checkbox" value="Source Code" checked>
        <span>Source Code</span>
        <button type="button" class="move-up">↑</button>
        <button type="button" class="move-down">↓</button>
    </div>

    <div class="stage-item">
        <input type="checkbox" value="Build" checked>
        <span>Build</span>
        <button type="button" class="move-up">↑</button>
        <button type="button" class="move-down">↓</button>
    </div>

    <div class="stage-item">
        <input type="checkbox" value="Testing" checked>
        <span>Testing</span>
        <button type="button" class="move-up">↑</button>
        <button type="button" class="move-down">↓</button>
    </div>

    <div class="stage-item">
        <input type="checkbox" value="Deployment" checked>
        <span>Deployment</span>
        <button type="button" class="move-up">↑</button>
        <button type="button" class="move-down">↓</button>
    </div>

</div>

</div>

<button id="createWorkflow">Create Workflow</button>

<pre id="output"></pre>
        <button id="downloadWorkflow" style="display: none;">
    Download YAML
</button>
    </main>
<script src="script.js"></script>
</body>
</html>
